name: CodeQL

# Static analysis of the app's Java/Kotlin code; results show in the repo's Security tab.
# Informational only: it never blocks a release.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual

      # Debug build, no secrets. The build refuses to configure on CI without a release key, so it gets a
      # throwaway one made here (nothing is signed with it).
      - name: Build
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway -keypass throwaway \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname CN=throwaway
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/throwaway.jks"
          export KEYSTORE_PASSWORD=throwaway
          export KEY_ALIAS=throwaway
          export KEY_PASSWORD=throwaway
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:java-kotlin"
